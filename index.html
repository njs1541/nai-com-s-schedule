<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>가벼운 메모장 스케줄러</title>
  <link rel="stylesheet" href="style.css?v=1.2">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#ffffff">
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore-compat.js"></script>
</head>

<body>
  <!-- 일정 검색 패널 -->
  <aside id="search-panel" class="hidden">
    <div class="search-header">
      <h2>일정 검색</h2>
      <button id="close-search-btn" title="닫기">&times;</button>
    </div>
    <div class="search-box">
      <input type="text" id="search-input" placeholder="검색어 입력...">
      <div class="filter-options">
        <label><input type="checkbox" id="filter-completed"> 완료 제외</label>
      </div>
    </div>
    <div id="search-results">
      <!-- 검색 결과가 여기에 표시됨 -->
    </div>
  </aside>

  <div id="app">
    <!-- 상단 배너 영역 -->
    <div id="banner-area" class="hidden">
      <img id="banner-img" src="" alt="배너 이미지" class="hidden">
      <h1 id="banner-title" class="hidden"></h1>
    </div>

    <!-- 헤더 영역 (네비게이션 및 뷰 전환) -->
    <header>
      <div class="nav-controls">
        <button id="prev-btn">&lt;</button>
        <button id="today-btn" class="today-btn">오늘</button>
        <h1 id="current-date-display">2026년 5월</h1>
        <button id="next-btn">&gt;</button>
      </div>
      <div class="view-controls">
        <button id="monthly-view-btn" class="active">월간</button>
        <button id="weekly-view-btn">주간</button>
        <button id="search-btn" title="검색">🔍</button>
        <button id="settings-btn" title="설정">⚙️</button>
        <button id="memo-btn" title="메모">📝</button>
        <button id="login-btn" title="구글 로그인" style="background-color: #4285F4; color: white;">로그인</button>
        <button id="logout-btn" title="로그아웃" class="hidden">로그아웃</button>
      </div>
    </header>

    <!-- 월간 뷰 (Monthly View) -->
    <main id="monthly-view" class="view">
      <div id="calendar-grid-header" class="calendar-grid-header">
        <!-- JS를 통해 startDayOfWeek에 맞춰 요일 헤더가 생성됩니다. -->
      </div>
      <div id="calendar-grid" class="calendar-grid">
        <!-- JS를 통해 달력 날짜들이 여기에 생성됩니다. -->
      </div>
    </main>

    <!-- 주간 뷰 (Weekly View) -->
    <main id="weekly-view" class="view hidden">
      <div id="weekly-list" class="weekly-list">
        <!-- JS를 통해 각 요일별 입력 영역이 생성됩니다. -->
      </div>
    </main>

    <!-- 푸터 영역 (제작자 서명) -->
    <footer>
      <p>© 2026 Designed by <span class="signature">nai-com</span></p>
    </footer>
  </div>

  <!-- 설정 레이어 (모달) -->
  <div id="settings-modal" class="modal hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h2>설정</h2>
        <button id="close-settings-btn" class="close-btn">&times;</button>
      </div>
      <div class="modal-body">
        <div class="setting-item">
          <label for="start-day-select">한주의 시작일:</label>
          <select id="start-day-select">
            <option value="0">일요일</option>
            <option value="1">월요일</option>
          </select>
        </div>
        <div class="setting-item">
          <label for="dark-mode-toggle">다크 모드:</label>
          <input type="checkbox" id="dark-mode-toggle">
        </div>
        <div class="setting-item">
          <label for="bg-color-picker">배경 색상:</label>
          <input type="color" id="bg-color-picker" value="#f5f5f0">
        </div>
        <div class="setting-item">
          <label for="font-select">글씨체:</label>
          <select id="font-select">
            <option value="'Nanum Pen Script', cursive">'Nanum Pen Script' (디폴트)</option>
            <option value="'Noto Sans KR', sans-serif">'Noto Sans KR'</option>
            <option value="'Gowun Dodum', sans-serif">'Gowun Dodum'</option>
            <option value="'Dongle', sans-serif">'Dongle'</option>
            <option value="'Jua', sans-serif">'Jua'</option>
          </select>
        </div>
        <hr class="settings-divider">
        <div class="setting-item-column">
          <label for="banner-title-input">배너 제목:</label>
          <input type="text" id="banner-title-input" placeholder="스케줄러 제목 입력">
        </div>
        <div class="setting-item-column">
          <label for="banner-url-input">배너 이미지 URL:</label>
          <input type="text" id="banner-url-input" placeholder="이미지 주소 (http...)">
        </div>
        <div class="setting-item-column">
          <label for="banner-file-input">배너 이미지 업로드:</label>
          <input type="file" id="banner-file-input" accept=".jpg, .jpeg, .png, .gif">
          <button id="delete-banner-img-btn" class="action-btn banner-delete-btn">배너 이미지 삭제</button>
        </div>
        <hr class="settings-divider wide">
        <div class="setting-item backup-restore">
          <button id="reset-settings-btn" class="action-btn danger-btn">옵션값 초기화</button>
          <button id="backup-btn" class="action-btn">데이터 백업 (저장)</button>
          <button id="restore-btn" class="action-btn">데이터 복구 (불러오기)</button>
          <input type="file" id="restore-file-input" accept=".json" style="display: none;">
        </div>
      </div>
    </div>
  </div>

  <!-- 사이드 메모 패널 -->
  <aside id="memo-panel" class="hidden">
    <div class="memo-header">
      <h2>메모장</h2>
      <div style="display: flex; gap: 10px; align-items: center;">
        <button id="add-memo-btn" title="메모 추가">+</button>
        <button id="close-memo-btn" style="background: transparent; border: none; font-size: 1.8rem; line-height: 1; cursor: pointer; color: var(--text-color); opacity: 0.6;" title="닫기">&times;</button>
      </div>
    </div>
    <div id="memo-list">
      <!-- JS로 메모 항목이 추가됨 -->
    </div>
  </aside>

  <!-- 모바일 전용 하단 액션 바 -->
  <div id="mobile-action-bar">
    <div class="action-bar-content">
      <button id="mobile-check-btn" class="bar-btn" title="완료">✔</button>
      <div class="bar-divider"></div>
      <button class="bar-btn color-dot c-none" data-color="none" title="기본"></button>
      <button class="bar-btn color-dot c-yellow" data-color="yellow" title="노랑"></button>
      <button class="bar-btn color-dot c-pink" data-color="pink" title="분홍"></button>
      <button class="bar-btn color-dot c-green" data-color="green" title="초록"></button>
      <div class="bar-divider"></div>
      <button id="mobile-delete-btn" class="bar-btn" title="삭제">×</button>
    </div>
  </div>

  <script src="app.js?v=1.2"></script>
  <script src="firebase-sync.js?v=1.0"></script>
</body>

</html>
