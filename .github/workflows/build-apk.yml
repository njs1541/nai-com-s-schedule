name: Build Android APK (TWA)

on:
  workflow_dispatch: # 수동 실행 버튼

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Create TWA Android project
        run: |
          mkdir -p twa-app/app/src/main/res/values
          mkdir -p twa-app/app/src/main/res/mipmap-xxxhdpi
          mkdir -p twa-app/gradle/wrapper

          # --- settings.gradle ---
          cat > twa-app/settings.gradle << 'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "Scheduler"
          include ':app'
          EOF

          # --- build.gradle (project) ---
          cat > twa-app/build.gradle << 'EOF'
          plugins {
              id 'com.android.application' version '8.2.2' apply false
          }
          EOF

          # --- app/build.gradle ---
          cat > twa-app/app/build.gradle << 'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'io.github.njs1541.scheduler'
              compileSdk 34

              defaultConfig {
                  applicationId "io.github.njs1541.scheduler"
                  minSdk 19
                  targetSdk 34
                  versionCode 1
                  versionName "1.0.0"

                  manifestPlaceholders = [
                      hostName: "njs1541.github.io",
                      defaultUrl: "https://njs1541.github.io/nai-com-s-schedule/",
                      launcherName: "스케줄러",
                      assetStatements: '[{ "relation": ["delegate_permission/common.handle_all_urls"], "target": { "namespace": "web", "site": "https://njs1541.github.io" } }]'
                  ]
              }

              buildTypes {
                  debug {
                      minifyEnabled false
                  }
                  release {
                      minifyEnabled false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
              implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
          }
          EOF

          # --- AndroidManifest.xml ---
          cat > twa-app/app/src/main/AndroidManifest.xml << 'XMLEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="${launcherName}"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.LauncherTheme">

                  <meta-data
                      android:name="asset_statements"
                      android:value='${assetStatements}' />

                  <activity
                      android:name="android.support.customtabs.trusted.LauncherActivity"
                      android:exported="true"
                      android:label="${launcherName}">

                      <meta-data
                          android:name="android.support.customtabs.trusted.DEFAULT_URL"
                          android:value="${defaultUrl}" />

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                      <intent-filter android:autoVerify="true">
                          <action android:name="android.intent.action.VIEW" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.BROWSABLE" />
                          <data android:scheme="https" android:host="${hostName}" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          XMLEOF

          # --- styles.xml (스플래시 테마) ---
          cat > twa-app/app/src/main/res/values/styles.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.LauncherTheme" parent="Theme.AppCompat.NoActionBar">
                  <item name="android:windowBackground">#FFF5F5F0</item>
                  <item name="android:statusBarColor">#FFFFFFFF</item>
                  <item name="android:navigationBarColor">#FFFFFFFF</item>
              </style>
          </resources>
          EOF

          # --- strings.xml ---
          cat > twa-app/app/src/main/res/values/strings.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">스케줄러</string>
          </resources>
          EOF

          # --- 아이콘 다운로드 ---
          curl -sL "https://njs1541.github.io/nai-com-s-schedule/icon-512.png" -o twa-app/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

          # --- gradle.properties (AndroidX 활성화) ---
          cat > twa-app/gradle.properties << 'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx1536m
          EOF

          # --- gradle-wrapper.properties ---
          cat > twa-app/gradle/wrapper/gradle-wrapper.properties << 'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.5-bin.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF

          # --- gradle wrapper 생성 ---
          cd twa-app
          gradle wrapper --gradle-version 8.5

          echo "=== TWA project structure ==="
          find . -type f | head -30

      - name: Build debug APK
        working-directory: twa-app
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: List build outputs
        working-directory: twa-app
        run: |
          echo "=== APK files ==="
          find . -name "*.apk" 2>/dev/null
          ls -la app/build/outputs/apk/debug/ 2>/dev/null || echo "No debug APK dir"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: scheduler-apk
          path: twa-app/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
