name: Build Android APK (TWA)

on:
  workflow_dispatch: # 수동 실행 버튼

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Create TWA project directory
        run: mkdir -p twa-build

      - name: Initialize TWA project with Bubblewrap
        working-directory: twa-build
        run: |
          # JDK와 Android SDK 경로를 환경변수로 설정하여 bubblewrap이 묻지 않도록 함
          export JAVA_HOME=$JAVA_HOME
          export ANDROID_HOME=$ANDROID_HOME
          
          # bubblewrap init 실행 (--yes 는 대화형 질문을 모두 자동 수락)
          bubblewrap init \
            --manifest="https://njs1541.github.io/nai-com-s-schedule/manifest.json" \
            --directory="." \
            --skipPwaValidation

      - name: Generate signing key
        working-directory: twa-build
        run: |
          keytool -genkeypair \
            -alias mykey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -keystore ./mykeystore.keystore \
            -storepass android \
            -keypass android \
            -dname "CN=Debug, OU=Debug, O=Debug, L=Seoul, ST=Seoul, C=KR"

      - name: Build APK
        working-directory: twa-build
        run: |
          bubblewrap build \
            --skipPwaValidation \
            --signingKeyPath="./mykeystore.keystore" \
            --signingKeyAlias="mykey" \
            2>&1 <<EOF
          android
          android
          EOF

      - name: List build outputs
        working-directory: twa-build
        run: |
          echo "=== All APK/AAB files ==="
          find . -name "*.apk" -o -name "*.aab" 2>/dev/null
          echo "=== Current directory ==="
          ls -la *.apk 2>/dev/null || echo "No APK found in current dir"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: scheduler-apk
          path: |
            twa-build/*.apk
            twa-build/app/build/outputs/**/*.apk
          if-no-files-found: warn
